aid: spade
name: Spade
description: >-
  Spade is a real-time transaction enrichment and merchant intelligence platform for financial
  services. Its API transforms raw, messy card, transfer, and universal transaction records into
  clean, structured, verified merchant, location, and category data with sub-50ms latency. Fintechs,
  banks, and card issuers use Spade for authorization decisions, rewards attribution,
  recurring-payment detection, risk and fraud signals, spend analytics, and category
  personalization, plus merchant search and account/program/user/card-scoped action triggers. Spade
  operates east and west US sandbox and production environments and is SOC 2 Type II certified.
