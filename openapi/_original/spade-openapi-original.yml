    EnrichmentResponse:
      type: object
      properties:
        enrichmentId:
          type: string
          format: uuid
          description: Our ID representing the enrichment, not to be confused with your provided `transactionId`.
        transactionInfo:
          type: object
          properties:
            type:
              type: string
              description: The main type of the transaction. For card transactions, the type is always
                "spending".
              enum:
              - account_verification
              - atm
              - debt
              - fee
              - income
              - other_money_movement
              - reimbursement
              - spending
              examples:
              - spending
            subType:
              type:
              - string
              - 'null'
              description: The more specific type of the transaction, if applicable. For card transactions,
                the `subType` is always `null`.
              enum:
              - alimony_or_child_support
              - atm
              - bnpl
              - business
              - cash_advance
              - deposit
              - disbursements
              - earned_income
              - government_benefits
              - insurance
              - investment
              - nsf
              - other
              - overdraft
              - payment
              - payout
              - rental
              - retirement
              - tax_refund
              - transfer
              - withdrawal
              examples:
              - null
            display:
              type:
              - object
              - 'null'
              description: 'An object containing display information for the transaction. The fields in
                this object are pulled from other parts of the enrichment and surfaced here for convenience.

                '
              properties:
                name:
                  type:
                  - string
                  maxLength: 64
                  description: The best name for display.
                  examples:
                  - Amazon
                categoryName:
                  type:
                  - string
                  - 'null'
                  maxLength: 64
                  description: The best category name for display.
                  examples:
                  - Online Marketplace
                graphic:
                  type:
                  - string
                  - 'null'
                  maxLength: 128
                  description: 'The best graphic for display. Depending on the data available, this will
                    be either a) the counterparty logo, b) the third party logo, or c) the category icon.

                    '
                  format: url
                  examples:
                  - https://static.v2.spadeapi.com/logos/de33f8973bc934c5b368a5b27155db02/light.png
                  - https://static.v2.spadeapi.com/categories/b4b0d249b40249acb7445027d4574fc5/light.png
                graphicSource:
                  type:
                  - string
                  - 'null'
                  maxLength: 16
                  enum:
                  - counterparty
                  - third_party
                  - category
                  description: 'The field from which the `graphic` was sourced. This will be either `counterparty`,
                    `third_party`, or `category`.

                    '
                  examples:
                  - counterparty
            thirdParties:
              type: array
              description: An array of third parties involved in the transaction, when applicable. Entities
                such as Toast, Square, Uber Eats, Doordash, etc. will appear here.
              items:
                $ref: '#/components/schemas/ThirdParty'
            spendingInfo:
              type:
              - object
              - 'null'
              description: Additional information about transactions whose `type` is "spending". This
                field is `null` for other types of transactions.
              properties:
                channel:
                  type: object
                  properties:
                    value:
                      type:
                      - string
                      - 'null'
                      enum:
                      - digital
                      - physical
                      - null
                      description: Spending channel value of digital or physical, null if we are unable
                        to determine.
            transferInfo:
              type:
              - object
              - 'null'
              description: Additional information about transfers. This field is `null` for card transactions.
              properties:
                direction:
                  type:
                  - string
                  maxLength: 12
                  enum:
                  - outgoing
                  - incoming
                  description: The transfer direction.
                  examples:
                  - outgoing
                transferMethod:
                  type:
                  - string
                  maxLength: 12
                  enum:
                  - ach
                  - cash
                  - check
                  - intrabank
                  - rtp
                  - unknown
                  - wire
                  description: The transfer method.
                  examples:
                  - ach
                transferType:
                  type:
                  - string
                  maxLength: 12
                  enum:
                  - external
                  - internal
                  - unknown
                  description: The transfer type. "external" indicates that money is being sent to an
                    external counterparty. "internal" indicates that money is being moved between accounts
                    owned by the same entity.
                  examples:
                  - external
                isAdjustmentOrRefund:
                  type:
                  - boolean
                  description: Whether the transfer is an adjustment or refund.
                  examples:
                  - false
            atmInfo:
              type:
              - object
              - 'null'
              description: Additional information about ATM transactions. This field is `null` for other
                types of transactions.
              examples:
              - null
              properties:
                sponsorName:
                  type:
                  - string
                  maxLength: 64
                  description: The name of the sponsor of the ATM involved in the transaction.
                  examples:
                  - Fiserv
                ownerName:
                  type:
                  - string
                  maxLength: 64
                  description: The name of the owner of the ATM involved in the transaction.
                  examples:
                  - Wells Fargo
            isAccountVerification:
              type:
              - boolean
              - 'null'
              description: Whether the transfer is an account verification. Currently only available for
                transfers.
              examples:
              - false
            isPeerToPeer:
              type:
              - boolean
              - 'null'
              description: Whether the transaction is a peer-to-peer transaction. Currently only available
                for transfers.
              examples:
              - false
            isDigitalWallet:
              type:
              - boolean
              - 'null'
              description: Whether the transaction involves a digital wallet. Currently only available
                for transfers.
              examples:
              - false
            transactionId:
              type: string
              maxLength: 512
              description: Your ID representing this transaction. This ID exactly matches the transactionId
                you provided in your enrichment request.
              examples:
              - transaction_id_123456789
            recurrenceInfo:
              type:
              - object
              - 'null'
              description: A recurring transaction is a repeated payment pattern to a counterparty, based
                on periodicty and amount. Premium Spade Signal available depending on your product package.
              properties:
                intervalType:
                  type:
                  - string
                  - 'null'
                  maxLength: 12
                  enum:
                  - weekly
                  - biweekly
                  - semi_monthly
                  - monthly
                  - quarterly
                  - annually
                  description: Recurrence cadence.
                intervalDays:
                  type:
                  - integer
                  - 'null'
                  description: Number of days between recurrences.
                  examples:
                  - 30
                nextPaymentExpected:
                  type:
                  - string
                  - 'null'
                  maxLength: 10
                  format: date
                  description: Next expected payment date.
                  examples:
                  - '2024-08-07'
                recentRecurrences:
                  type:
                  - array
                  - 'null'
                  description: Array of recent recurrence objects, null if no recurrence exists.
                  items:
                    type: array
                    properties:
                      amount:
                        type: number
                        description: Amount of the recurrence.
                        examples:
                        - 130
                      enrichmentId:
                        type: string
                        description: Our ID representing the enrichment, not to be confused with your
                          provided `transactionId`.
                        examples:
                        - c1d4064b-9364-43d3-8ee3-500898cda1aa
                      occurredAt:
                        type: string
                        format: date-time
                        description: Date and time the transaction occurred. Formatted as an ISO 8601
                          date time.
                        examples:
                        - '2024-06-06T14:25:11+00:00'
                      transactionId:
                        type: string
                        description: Customer-provided identifier for the transaction.
                        examples:
                        - d6c4dc4e-e0da-4782-b581-95916523d87a
            riskInsights:
              type:
              - object
              - 'null'
              description: Risk insights provide visibility into the potential risk of a transaction and
                the merchants involved. Premium Spade Signal available depending on your product package.
              properties:
                irregularWebPresenceDetected:
                  type:
                  - boolean
                  - 'null'
                  description: Has engaged in deceptive online practices or has irregular website structure
                    or content.
                  examples:
                  - false
                negativeOnlineSentiment:
                  type:
                  - boolean
                  - 'null'
                  description: Negative online consumer feedback associated with the counterparty.
                  examples:
                  - false
                highRiskEntity:
                  type:
                  - boolean
                  - 'null'
                  description: The counterparty is known to engage in fraudulent practices.
                  examples:
                  - false
                riskyIndustry:
                  type:
                  - boolean
                  - 'null'
                  description: Industry is correlated with increased disputes (based on Spade industries).
                  examples:
                  - false
                cardAcceptanceHistory:
                  type:
                  - string
                  - 'null'
                  enum:
                  - extensive
                  - established
                  - stable
                  - limited
                  - very_limited
                  - 'null'
                  description: Counterparties with lower levels of card acceptance history have a higher
                    likelihood of chargebacks or fraudulent activity.
                  examples:
                  - extensive
        counterparty:
          type: array
          description: An array of counterparties matched to the transaction, ordered by descending match
            score.
          items:
            $ref: '#/components/schemas/Counterparty'
        mobileAppInfo:
          $ref: '#/components/schemas/MobileAppInfo'
        customAttributes:
          $ref: '#/components/schemas/CustomAttributesResponseField'
        actions:
          type:
          - array
          - 'null'
          description: 'An array of triggered actions, or `null` if no triggers matched.

            This field is only present if your integration has the actions feature enabled.


            When a transaction matches one or more registered triggers, this array contains the action
            details

            including your custom `action` data. Multiple matches are possible when triggers are registered

            at different scopes (account, program, user, card).

            '
          items:
            $ref: '#/components/schemas/TriggeredActionResponse'
          examples:
          - - id: trigger-12345
              type: merchant_trigger
              action:
                type: REWARD
                rewardPercent: 5
              scope: account
              source: counterparty
