components:
  parameters:
    SynchronousBatchParam:
      name: synchronous
      in: query
      required: false
      description: 'When `true`, returns enriched results inline in the response instead of a `batchId`.
        Microbatches are capped to ensure timely processing. See the [Microbatch enrichment guide](https://docs.spade.com/reference/microbatch-enrichment-guide)
        for details.

        '
      schema:
        type: boolean
        default: false
  callbacks:
    batchStatusCallback:
      '{$request.body#/callbackUrl}':
        post:
          description: 'If you set a `callbackUrl` in the body parameters of the request to the `/batches`
            endpoint, Spade will send a `POST` request to that `callbackUrl` when the batch job finishes.
            The `requestBody` of the callback request will contain the body parameters specified below.
            We also include a webhook token in the X-Webhook-Token header. Use this token to verify that
            the callback is from Spade. Contact your Spade representative if you do not have this token.
            If the reported status is `completed`, you can use the [/batches/{batchId}/results](https://docs.spade.com/api-reference/transfer-enrichment/get-the-results-of-a-batch-transfer-enrichment-job)
            endpoint to retrieve the results of the batch job.

            '
          requestBody:
            content:
              application/json:
                schema:
                  allOf:
                  - $ref: '#/components/schemas/BatchCallbackApiRequest'
                  - type: object
                    required:
                    - batchId
                    - status
          parameters:
          - in: header
            name: X-Webhook-Token
            schema:
              type: string
            required: true
            description: A token that can be used to verify the callback is from Spade. This will match
              the token provided to you by the Spade team.
          responses:
            '200':
              description: Your server returns this code if it accepts the callback
            '500':
              description: Your server encountered an unexpected error
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            type: object
            properties:
              invalidField:
                type: array
                items:
                  type: string
                  examples:
                  - This field is required.
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              details:
                type: string
                examples:
                - Incorrect authentication credentials.
    BatchJobNotFound:
      description: Batch job not found
      content:
        application/json:
          schema:
            type: object
            properties:
              details:
                type: string
                examples:
                - Batch job not found.
    TooManyRequests:
      description: Too many requests. Currently, requests are limited to 1000 every 5 minutes per IP address.
      content:
        application/json:
          schema:
            type: object
            properties:
              details:
                type: string
                examples:
                - Too many requests. Currently, requests are limited to 1000 every 5 minutes per IP address.
    InternalServerError:
      description: Unexpected Error
      content:
        application/json:
          schema:
            type: object
            properties:
              details:
                type: string
                examples:
                - Internal server error.
  schemas:
    CommonRequestLocation:
      type: object
      properties:
        address:
          type: string
          maxLength: 256
          examples:
          - 1234 W 5th Ave Suite 100
        city:
          type: string
          maxLength: 256
          examples:
          - New York
          description: 'The city as it appears in the transaction data; in some cases this can be a phone
            number or website, which are also valid inputs.

            '
        region:
          type: string
          maxLength: 256
          examples:
          - NY
          description: 'Two letter code for state, province, territory, etc. For US states, ANSI codes
            may be provided instead (e.g. "15" for Hawaii). While standard two-letter or ANSI codes are
            preferred when available, full region names may also be provided (e.g. "Hawaii"). *For an
            enhanced response, we \*strongly\* recommend including this field.*

            '
        country:
          type: string
          maxLength: 256
          examples:
          - USA
          description: Three letter country code.
        postalCode:
          type: string
          maxLength: 32
          examples:
          - '10001'
          description: A US zip code or other international postal code. In the case where a US zip code
            is provided and the state is missing, the state will be inferred from the zip code.
        latitude:
          type:
          - number
          - 'null'
          examples:
          - 45
          description: Additional latitude data related to the transaction being enriched.
        longitude:
          type:
          - number
          - 'null'
          examples:
          - 120
          description: Additional longitude data related to the transaction being enriched.
    ResponseLocation:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          examples:
          - fdf79470-3deb-4638-956a-6859e473b9d8
          description: A unique identifier for this location.
        address:
          type:
          - string
          - 'null'
          maxLength: 64
          examples:
          - 1234 W 5th Ave Suite 100
          description: Street number, name, and any secondary address information.
        addressLine1:
          type:
          - string
          - 'null'
          maxLength: 64
          examples:
          - 1234 W 5th Ave
          description: Street number and name.
        addressLine2:
          type:
          - string
          - 'null'
          maxLength: 32
          examples:
          - Suite 100
          description: Secondary address information.
        city:
          type:
          - string
          - 'null'
          maxLength: 64
          examples:
          - New York
        region:
          type:
          - string
          - 'null'
          maxLength: 64
          examples:
          - NY
          description: Region code. Typically a two-letter code for US states, but may vary for international
            regions.
        country:
          type:
          - string
          - 'null'
          maxLength: 3
          examples:
          - USA
          description: Three letter country code.
        postalCode:
          type:
          - string
          - 'null'
          maxLength: 12
          examples:
          - '10001'
          description: Location postal code or zip code.
        latitude:
          type:
          - number
          - 'null'
          examples:
          - 45
          description: Location latitude.
        longitude:
          type:
          - number
          - 'null'
          examples:
          - 120
          description: Location longitude.
        phoneNumber:
          type:
          - string
          - 'null'
          maxLength: 24
          examples:
          - '+18664862360'
          description: Location phone number.
        matchScore:
          description: 'The matchScore predicts how well a transaction matches a Location in our records.
            If no Location was found, the matchScore is set to null. Scores range between 0.00 and 100.0.
            Generally, a higher matchScore indicates a better match between a transaction and a Location.

            This is a premium Spade field available depending on your product package.

            '
          type:
          - number
          - 'null'
          examples:
          - 93.5
    IndustryCategoryLevel:
      description: A node in a tree representing a hierarchical category system
      type: object
      properties:
        id:
          type: string
          maxLength: 15
          examples:
          - 011-000-000-000
        name:
          type: string
          maxLength: 64
          examples:
          - Retail
        icon:
          type:
          - string
          - 'null'
          maxLength: 128
          format: url
          examples:
          - https://static.v2.spadeapi.com/categories/ee4ee39fd5474d31ac42f9e606b9040a/light.png
          description: Category icon.
    MobileAppInfo:
      description: 'The mobile app information for the transaction. This object is only non-null if the
        transaction was matched to a mobile app.

        '
      type:
      - object
      - 'null'
      properties:
        id:
          type:
          - string
          format: uuid
          examples:
          - 704bbd58-fb12-4bdb-9aae-2786704ea92a
          description: A unique identifier for this mobile app.
        name:
          type:
          - string
          maxLength: 512
          examples:
          - Roblox
          description: The name of the mobile app.
        url:
          type:
          - string
          - 'null'
          format: url
          examples:
          - https://play.google.com/store/apps/details?id=com.roblox.client
          description: The URL of the mobile app in the app store.
        logo:
          type:
          - string
          - 'null'
          format: url
          examples:
          - https://static.v2.spadeapi.com/logos/58c03a73629c46b8aa4c1e15cb4f0d0b/light.png
          description: The URL of the mobile app's logo.
        developerName:
          type:
          - string
          maxLength: 256
          examples:
          - Roblox Corporation
          description: The name of the developer of the mobile app.
        developerId:
          type:
          - string
          format: uuid
          examples:
          - 704bbd58-fb12-4bdb-9aae-2786704ea92a
          description: The ID of the developer of the mobile app.
        category:
          type:
          - string
          enum:
          - Auto and Transportation
          - Creative and Design
          - Education and Parenting
          - Entertainment and Media
          - Finance and Business
          - Games
          - Health and Lifestyle
          - Shopping and Marketplaces
          - Social and Communication
          - Travel and Events
          - Utility and Tools
          examples:
          - Auto and Transportation
          description: The category of the mobile app.
        hasGamblingOrRewards:
          type: boolean
          examples:
          - false
          description: Whether the mobile app has gambling or cash rewards.
        hasSimulatedGambling:
          type: boolean
          examples:
          - false
          description: Whether the mobile app has simulated gambling.
        ageRating:
          type:
          - string
          enum:
          - Children
          - Teen
          - Adult
          - Unknown
          examples:
          - Teen
          description: The age rating of the mobile app.
    Counterparty:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          examples:
          - 704bbd58-fb12-4bdb-9aae-2786704ea92a
          description: A unique identifier for this counterparty, regardless of specific location.
        name:
          type:
          - string
          - 'null'
          maxLength: 64
          examples:
          - Amazon
          description: Counterparty name.
        legalName:
          type:
          - string
          - 'null'
          maxLength: 128
          examples:
          - Amazon Inc.
          description: Counterparty legal name.
        industry:
          description: Array with increasingly specific category information.
          type: array
          items:
            $ref: '#/components/schemas/IndustryCategoryLevel'
        matchScore:
          description: 'The matchScore predicts how well a transaction matches a Counterparty in our records.
            If no Counterparty was found, the matchScore is set to null. Otherwise, scores range between
            50.00 and 100.00. We filter out results below this range to make sure that only high quality
            matches are returned. Generally, the higher the matchScore is the better the match between
            a transaction and a Counterparty. When multiple Counterparties match a transaction, matches
            are returned in decreasing order of matchScore. This is a premium Spade field available depending
            on your product package.

            '
          type:
          - number
          - 'null'
          examples:
          - 93.5
        location:
          type: array
          description: 'An array of locations matched to the transaction (and associated with this counterparty).
            Can currently contain only one location.

            '
          items:
            $ref: '#/components/schemas/ResponseLocation'
        logo:
          type:
          - string
          - 'null'
          maxLength: 128
          format: url
          examples:
          - https://static.v2.spadeapi.com/logos/de33f8973bc934c5b368a5b27155db02/light.png
          description: Counterparty logo.
        phoneNumber:
          type:
          - string
          - 'null'
          maxLength: 24
          examples:
          - '+18664862360'
          description: Counterparty phone number.
        website:
          type:
          - string
          - 'null'
          maxLength: 256
          format: url
          examples:
          - https://www.amazon.com
          description: Counterparty website.
        possibleCounterpartyAlternate:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
              examples:
              - 49fd51a1-5a19-3e5d-8d28-eb056ecf8939
              description: 'The ID of the alternate counterparty.

                '
            similarity:
              type: number
              examples:
              - 80
              description: 'The similarity score indicates how closely this alternate counterparty matches
                the main counterparty. The score is a value between 0.0 and 100.0, where 100.0 is an exact
                match.

                '
          description: 'The possible alternate counterparty object represents a counterparty that may
            be matched to this transaction in other enrichment requests.

            Premium Spade Field available depending on your product package.

            '
    ThirdParty:
      type: object
      properties:
        id:
          type: string
          format: uuid
          examples:
          - ac48cef2-0d7f-4159-865e-e92b152262bc
        name:
          type: string
          maxLength: 64
          examples:
          - Paypal
        type:
          type: string
          enum:
          - bnpl
          - delivery_service
          - marketplace
          - payment_processor
          - platform
          examples:
          - payment_processor
        logo:
          type:
          - string
          - 'null'
          maxLength: 128
          format: url
          examples:
          - https://static.v2.spadeapi.com/logos/9063bc0f0a3f4b1fbf644f9862e17002/light.png
          description: Third party logo.
        website:
          type:
          - string
          - 'null'
          maxLength: 256
          format: url
          examples:
          - https://www.paypal.com/
          description: Third party website.
    TransferEnrichmentResponse:
      allOf:
      - type: object
        properties:
          transactionInfo:
            properties:
              type:
                examples:
                - debt
              subType:
                examples:
                - payment
              spendingInfo:
                examples:
                - null
              thirdParties:
                items:
                  allOf:
                  - type: object
                    properties:
                      id:
                        examples:
                        - 038b7223-91b4-30bd-a2e8-851093c2f22d
                      name:
                        examples:
                        - Synchrony
                      type:
                        examples:
                        - payment_processor
                      logo:
                        examples:
                        - https://static.v2.spadeapi.com/logos/038b722391b430bda2e8851093c2f22d/light.png
                      website:
                        examples:
                        - https://synchrony.com/
                  - $ref: '#/components/schemas/ThirdParty'
              recurrenceInfo:
                examples:
                - null
          counterparty:
            items:
              allOf:
              - type: object
                properties:
                  location:
                    items:
                      allOf:
                      - type: object
                        properties:
                          id:
                            examples:
                            - null
                          address:
                            examples:
                            - null
                          addressLine1:
                            examples:
                            - null
                          addressLine2:
                            examples:
                            - null
