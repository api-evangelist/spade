    patch:
      description: 'Perform incremental operations on category action triggers at the account scope.


        Supports two operations:

        - **add**: Register new category triggers or update existing ones. Only the submitted triggers
        are affected—existing registrations are preserved. If a trigger ID already exists, its registration
