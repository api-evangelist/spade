          maxLength: 1024
          examples:
          - The counterparty is incorrect.
    CommonFraud:
      type: object
      properties:
        isFraud:
          type: boolean
          description: A boolean indicating if this transaction was suspected to involve fraud.
          examples:
          - false
        fraudType:
          type: string
          description: 'The type of fraud suspected to have occurred. This field can only be provided
            if `isFraud` is true.

            '
          enum:
          - card_not_present
          - card_testing
          - chargeback_fraud
          - counterfeit_card
          - merchant_fraud
          - other
          - phishing
          - stolen_card
          - unknown
          - none
        fraudNotes:
          type: string
          description: 'Any additional details related to fraud suspected to have occurred on the associated
            transaction. This field can only be provided if `isFraud` is true.

            '
          maxLength: 512
          examples:
          - Merchant is believed to commonly be used for card testing.
    EnrichmentFeedbackResponse:
      type: object
      description: Response for reporting any kind of enrichment feedback.
      properties:
        details:
          type: string
          examples:
          - Chargeback successfully reported.
    CustomAttributesRequestField:
      type: object
      maxProperties: 30
      description: 'A dictionary containing custom attributes that you would like to be returned in the
        response.

        Please ensure this object does not contain any PII.

        Restrictions include: `customAttributes` must be an object, up 30 custom attributes are allowed,
        each key must be a string <= 40 characters in length, and each value must be a string <= 250 characters
        in length.

        '
      additionalProperties:
        type: string
        maxLength: 250
      examples:
      - custom_attribute_1: value_1
        custom_attribute_2: value_2
    CustomAttributesResponseField:
      type: object
      description: A dictionary containing the custom attributes that were included in the enrichment
        request (if any).
      additionalProperties:
        type: string
      examples:
      - custom_attribute_1: value_1
        custom_attribute_2: value_2
    MerchantTriggerItem:
      type: object
      description: A merchant trigger to register for action matching.
      required:
      - id
      - merchantName
      - action
      properties:
        id:
          type: string
          description: Your identifier for this trigger, unique within the scope you are registering against.
            This ID will be returned in the `actions` field of enrichment responses when this trigger
            matches a transaction.
          maxLength: 512
          examples:
          - trigger-12345
        merchantName:
          type: string
          description: The name of the merchant.
          maxLength: 150
          examples:
          - Starbucks
        action:
          type: object
          description: 'A custom JSON object that will be returned in the enrichment response when this
            trigger matches. Use this to store any data relevant to your use case (e.g., reward amounts,
            offer IDs, campaign metadata).


            The optional `type` field has reserved values with special behavior:

            - `BLOCK`: Adds `authRecommendation: "BLOCK"` to the action in the enrichment response. Use
            this to flag transactions that should be declined.

            - `ALLOW_ONLY`: Adds `authRecommendation: "ALLOW"` when the transaction matches a registered
            merchant. If the transaction does **not** match any `ALLOW_ONLY` trigger, the action is returned
            with `authRecommendation: "BLOCK"` (inverse semantics). Use this to create allowlists where
            only registered merchants are permitted.

            - `REWARD`: No special behavior. Passed through as-is.

            - Any other value: Treated as a custom type and passed through as-is.

            '
          properties:
            type:
              type: string
              description: 'Optional action type. Reserved values `BLOCK` and `ALLOW_ONLY` have special
                authorization semantics (see above). All other values are passed through without modification.

                '
              examples:
              - REWARD
              - BLOCK
              - ALLOW_ONLY
          additionalProperties: true
          examples:
          - type: REWARD
            rewardPercent: 5
            offerId: offer-abc123
          - type: BLOCK
            reason: Gambling merchant
          - type: ALLOW_ONLY
            category: approved-vendors
        website:
          type: string
          description: The merchant's website URL. Required if location fields (address, city) are not
            provided.
          maxLength: 256
          examples:
          - https://www.starbucks.com
        address:
          type: string
          description: The street address of the merchant location.
          maxLength: 150
          examples:
          - 123 Main St
        city:
          type: string
          description: The city of the merchant location.
          maxLength: 100
          examples:
          - Seattle
        region:
          type: string
          description: The state or region of the merchant location.
          maxLength: 100
          examples:
          - WA
        country:
          type: string
          description: The country of the merchant location.
          maxLength: 100
          examples:
          - USA
        postalCode:
          type: string
          description: The postal code of the merchant location.
          maxLength: 20
          examples:
          - '98101'
        latitude:
          type: number
          format: double
          description: The latitude of the merchant location.
          examples:
          - 47.6062
        longitude:
          type: number
          format: double
          description: The longitude of the merchant location.
          examples:
          - -122.3321
        level:
          type: string
          enum:
          - corporation
          - location
          description: 'Controls whether matching is performed at the corporation level or location level.
            Use "corporation" for brand-level matching (e.g. apply trigger to Costco in general). Use
            "location" for a specific physical location (e.g. apply trigger to one specific Costco location).
            Defaults to "location" if not specified.

            '
          examples:
          - corporation
          - location
        customAttributes:
          type: object
          description: Optional custom attributes to associate with this trigger registration.
          additionalProperties:
            type: string
          examples:
          - storeId: store-789
    MerchantActionTriggerRegistrationRequest:
      type: object
      description: Request body for registering merchant action triggers.
      required:
      - merchantTriggers
      properties:
        merchantTriggers:
          type: array
          description: 'List of merchant triggers to register for action matching. Each trigger must have
            a unique `id`.


            **Field requirements:**

            - `id`, `merchantName`, and `action` are always required

            - If location fields (address, city) are NOT provided, `website` is required


            **Limits:** User-scope and card-scope registrations are limited to 100 triggers. Account-scope
            and program-scope registrations with more than 100 triggers will be processed asynchronously
            as a batch job.

            '
          minItems: 1
          maxItems: 100000
          items:
            $ref: '#/components/schemas/MerchantTriggerItem'
    ActionTriggerStatusResponse:
      type: object
      description: Response containing the status of an action trigger registration.
      properties:
        status:
          type: string
          description: 'The current status of the action trigger registration.

            - `pending`: Registration received, processing not yet started

            - `running`: Registration is being processed (for batch registrations with >100 triggers)

            - `succeeded`: Registration complete, triggers are now active

            - `failed`: Registration failed, check your request and retry

            '
          enum:
          - pending
          - running
          - succeeded
          - failed
          examples:
          - succeeded
        version:
          type: integer
          description: The version number of this registration. Increments with each PUT, PATCH, or DELETE
            request to this scope.
          examples:
          - 1
        merchantTriggers:
          type: array
          description: The list of active merchant triggers registered for this scope. Present on GET
            responses; omitted on PUT and PATCH responses.
          items:
            type: object
            properties:
              id:
                type: string
                description: The trigger ID as provided during registration.
                examples:
                - merchant_123
              action:
                type: object
                description: The action data associated with this trigger, as provided during registration.
                additionalProperties: true
                examples:
                - type: REWARD
                  points: 200
        totalCount:
          type: integer
          description: The total number of active merchant triggers registered for this scope. Present
            on GET responses; omitted on PUT and PATCH responses.
          examples:
          - 50000
    MerchantActionTriggerPatchRequest:
      type: object
      description: 'Request body for incremental merchant action trigger operations.


        - For `add`: `merchantTriggers` is required. `triggerIds` is optional and ignored if provided.

        - For `remove`: `triggerIds` is required and must be a non-empty list.'
      required:
      - operation
      properties:
        operation:
          type: string
          enum:
          - add
          - remove
          description: 'The operation to perform:

            - `add`: Register new merchants or update existing ones via merchant matching

            - `remove`: Remove merchants (excluded from enrichment lookups)'
          examples:
          - add
        merchantTriggers:
          type: array
          description: 'List of merchant triggers to add. Required for the `add` operation.


            If a trigger ID already exists, the old registration is replaced (upsert behavior).


            **Field requirements:**

            - `id`, `merchantName`, and `action` are always required

            - If location fields (address, city) are NOT provided, `website` is required'
          minItems: 1
          maxItems: 100000
          items:
            $ref: '#/components/schemas/MerchantTriggerItem'
        triggerIds:
          type:
          - array
          - 'null'
          description: 'List of trigger IDs to remove. Required and must be non-empty for the `remove`
            operation.


            Trigger IDs that are not currently active are silently ignored (idempotent).


            For `add` operations, this field is optional and ignored if provided — you may pass `null`,
            `[]`, or omit it entirely.'
          items:
            type: string
            maxLength: 512
          examples:
          - - merchant_123
            - merchant_456
    ActionTriggerPatchResponse:
      type: object
      description: Response for the remove PATCH operation.
      properties:
        status:
          type: string
          enum:
          - succeeded
          examples:
          - succeeded
        version:
          type: integer
          description: The version number of this operation.
          examples:
          - 5
    CategoryTriggerItem:
      type: object
      description: A category trigger to register for action matching.
      required:
      - id
      - categoryId
      - action
      properties:
        id:
          type: string
          description: Your identifier for this trigger, unique within the scope you are registering against.
            This ID will be returned in the `actions` field of enrichment responses when this trigger
            matches a transaction.
          maxLength: 512
          examples:
          - travel-reward-1
        categoryId:
          type: string
          description: The Spade category ID to match against. Category IDs use the format `xxx-xxx-xxx-xxx`
            where each `x` is a digit — use [`GET /categories`](https://docs.spade.com/api-reference/category-personalization/get-all-default-and-custom-integration-level-categories)
            to discover valid IDs.
          maxLength: 15
          pattern: ^\d{3}-\d{3}-\d{3}-\d{3}$
          examples:
          - 020-001-000-000
        action:
          type: object
          description: 'A custom JSON object that will be returned in the enrichment response when this
            trigger matches. Use this to store any data relevant to your use case (e.g., reward amounts,
            offer IDs, campaign metadata).


            The optional `type` field has reserved values with special behavior:

            - `BLOCK`: Adds `authRecommendation: "BLOCK"` to the action in the enrichment response. Use
            this to flag transactions that should be declined.

            - `ALLOW_ONLY`: Adds `authRecommendation: "ALLOW"` when the transaction matches a registered
            category. If the transaction does **not** match any `ALLOW_ONLY` trigger, the action is returned
            with `authRecommendation: "BLOCK"` (inverse semantics). Use this to create allowlists where
            only registered categories are permitted.

            - `REWARD`: No special behavior. Passed through as-is.

            - Any other value: Treated as a custom type and passed through as-is.

            '
          properties:
            type:
              type: string
              description: 'Optional action type. Reserved values `BLOCK` and `ALLOW_ONLY` have special
                authorization semantics (see above). All other values are passed through without modification.

                '
              examples:
              - REWARD
              - BLOCK
              - ALLOW_ONLY
          additionalProperties: true
          examples:
          - type: REWARD
            rewardPercent: 3
            offerId: travel-3x-promo
          - type: BLOCK
            reason: Gambling not permitted
          - type: ALLOW_ONLY
    CategoryActionTriggerRegistrationRequest:
      type: object
      description: Request body for registering category action triggers.
      required:
      - categoryTriggers
      properties:
        categoryTriggers:
          type: array
          description: 'List of category triggers to register for action matching. Each trigger must have
            a unique `id`.


            **Field requirements:**

            - `id`, `categoryId`, and `action` are always required


            **Limit:** A maximum of 300 triggers across all scopes. All registrations are processed synchronously.

            '
          minItems: 1
          maxItems: 300
          items:
            $ref: '#/components/schemas/CategoryTriggerItem'
    CategoryActionTriggerStatusResponse:
      type: object
      description: Response containing the status of a category action trigger registration.
      properties:
        status:
          type: string
          description: 'The current status of the action trigger registration. Category trigger registrations
            are processed synchronously, so the status is always one of:

            - `succeeded`: Registration complete, triggers are now active

            - `failed`: Registration failed, check your request and retry

            '
          enum:
          - succeeded
          - failed
          examples:
          - succeeded
        version:
          type: integer
          description: The version number of this registration. Increments with each PUT, PATCH, or DELETE
            request to this scope.
          examples:
          - 1
        categoryTriggers:
          type: array
          description: The list of active category triggers registered for this scope. Present on GET
            responses; omitted on PUT and PATCH responses.
          items:
            type: object
            properties:
              id:
                type: string
                description: The trigger ID as provided during registration.
                examples:
                - travel-reward-1
              categoryId:
                type: string
                description: The category ID associated with this trigger, as provided during registration.
                examples:
                - 020-001-000-000
              action:
                type: object
                description: The action data associated with this trigger, as provided during registration.
                additionalProperties: true
                examples:
                - type: REWARD
                  rewardPercent: 3
        totalCount:
          type: integer
          description: The total number of active category triggers registered for this scope. Present
            on GET responses; omitted on PUT and PATCH responses.
          examples:
          - 10
    CategoryActionTriggerPatchRequest:
      type: object
      description: 'Request body for incremental category action trigger operations.


        - For `add`: `categoryTriggers` is required. `triggerIds` is optional and ignored if provided.

        - For `remove`: `triggerIds` is required and must be a non-empty list.'
      required:
      - operation
      properties:
        operation:
          type: string
          enum:
          - add
          - remove
          description: 'The operation to perform:

            - `add`: Register new category triggers or update existing ones

            - `remove`: Remove category triggers (excluded from enrichment lookups)'
          examples:
          - add
        categoryTriggers:
          type: array
          description: 'List of category triggers to add. Required for the `add` operation.


            If a trigger ID already exists, the old registration is replaced (upsert behavior).


            **Field requirements:**

            - `id`, `categoryId`, and `action` are always required'
          minItems: 1
          maxItems: 300
          items:
            $ref: '#/components/schemas/CategoryTriggerItem'
        triggerIds:
          type:
          - array
          - 'null'
          description: 'List of trigger IDs to remove. Required and must be non-empty for the `remove`
            operation.


            Trigger IDs that are not currently active are silently ignored (idempotent).


            For `add` operations, this field is optional and ignored if provided — you may pass `null`,
            `[]`, or omit it entirely.'
          items:
            type: string
            maxLength: 512
          examples:
          - - travel-reward-1
            - block-gambling
    TriggeredActionResponse:
      type: object
      description: A triggered action returned in the enrichment response.
      properties:
        id:
          type: string
          maxLength: 512
          description: Your unique identifier for the matched trigger (as provided during registration).
          examples:
          - trigger-12345
        type:
          type: string
          description: The type of trigger that matched — `merchant_trigger` for merchant-based triggers,
            `category_trigger` for category-based triggers.
          enum:
          - merchant_trigger
          - category_trigger
          example: merchant_trigger
          examples:
          - merchant_trigger
        action:
          type: object
          description: 'The custom action data you provided during registration for this trigger.


            For `BLOCK` and `ALLOW_ONLY` action types, an `authRecommendation` field is automatically
            added:

            - `BLOCK` triggers: `authRecommendation` is set to `"BLOCK"`.

            - `ALLOW_ONLY` triggers that match: `authRecommendation` is set to `"ALLOW"`.

            - `ALLOW_ONLY` triggers that do not match (inverse semantics): `authRecommendation` is set
            to `"BLOCK"`.

            '
          additionalProperties: true
          properties:
            authRecommendation:
              type: string
              description: Authorization recommendation injected for `BLOCK` and `ALLOW_ONLY` action types.
                Not present for other action types.
              enum:
              - ALLOW
              - BLOCK
          examples:
          - type: REWARD
            rewardPercent: 5
            offerId: offer-abc123
          - type: BLOCK
            reason: Gambling merchant
            authRecommendation: BLOCK
          - type: ALLOW_ONLY
            category: approved-vendors
            authRecommendation: ALLOW
        scope:
          type: string
          description: The scope at which this trigger was registered (account, program, user, or card).
          enum:
          - account
          - program
          - user
          - card
          example: account
          examples:
          - account
        source:
          type:
          - string
          - 'null'
          description: 'Indicates whether the action was triggered by the matched counterparty or third
            party.


            This field will be set to `null` when an `ALLOW_ONLY` action trigger was set up whose condition
            the current transaction did not meet. The `authRecommendation` in this case will be `BLOCK`.

            '
          enum:
          - counterparty
          - third_party
          - null
          example: counterparty
          examples:
          - counterparty
        categoryId:
          type: string
          description: The Spade category ID that matched this trigger. Only present when `type` is `category_trigger`.
          examples:
          - b4b0d249-b402-49ac-b744-5027d4574fc5
        categoryName:
          type: string
          description: The name of the Spade category that matched this trigger. Only present when `type`
            is `category_trigger`.
          examples:
          - Travel
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      name: X-Api-Key
      in: header
security:
- ApiKeyAuth: []
