  /enrichments/{enrichmentId}/chargeback:
    parameters:
    - in: path
      name: enrichmentId
      schema:
        type: string
      description: The `enrichmentId` of enrichment associated with the transaction where a chargeback
        occurred.
      required: true
    post:
      description: 'An endpoint for reporting that a chargeback process has occurred on a transaction.
        The `state` and `chargebackNotes` properties can be used to provide information about the chargeback.
        The `isFraud`, `fraudType`, and `fraudNotes` are used to provide information about fraud or suspected
        fraud related to this chargeback. Note that this transaction must previously have been enriched
        to report the chargeback.

        '
      tags:
      - Feedback and Reporting
      summary: Report that a chargeback occurred
      operationId: enrichmentChargeback
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - state
                properties:
                  state:
                    type: string
                    description: 'The state of the chargeback process. You can update a chargeback''s
                      `state` by submitting another request with a new `state`, for example, a new request
                      could update the `state` from `chargeback_pending` to `chargeback_won`.

                      '
                    enum:
                    - chargeback_won
                    - chargeback_lost
                    - chargeback_pending
                    examples:
                    - chargeback_won
                  chargebackNotes:
                    type: string
                    description: Any additional details related to the chargeback not covered by the state.
                    maxLength: 512
                    examples:
                    - Transaction was initiated in error.
                  occurredAt:
                    type: string
                    format: date-time
                    description: 'The time when the chargeback''s state change. This could be the time
                      when the chargeback was initiated and its state became `chargeback_pending` or the
                      time when the chargeback was resolved its state moved to `chargeback_won` or `chargeback_lost`.
                      Formatted as an ISO 8601 date time.

                      '
                    examples:
                    - '2022-06-15 18:27:51Z'
              - $ref: '#/components/schemas/CommonFraud'
      responses:
        '200':
          description: Chargeback reported successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentFeedbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
