openapi: 3.1.0
info:
  title: Spade API
  description: Documentation for Spade's card transaction enrichment API and related endpoints. We offer
    sandbox and production environments on both the east coast and west coast to enable ultra low latency
    enrichment for realtime applications. Each environment requires different API keys. To inquire about
    API keys, please contact your Spade representative or reach out to <hello@spade.com>.
  version: 2.7.3
servers:
- url: https://east.sandbox.spade.com
  description: East coast sandbox environment
- url: https://east.api.spade.com
  description: East coast production environment
- url: https://west.sandbox.spade.com
  description: West coast sandbox environment
- url: https://west.api.spade.com
  description: West coast production environment
- url: https://sandbox.v2.spadeapi.com
  description: East coast sandbox environment (deprecated)
- url: https://v2.spadeapi.com
  description: East coast production environment (deprecated)
- url: https://sandbox.west.v2.spadeapi.com
  description: West coast sandbox environment (deprecated)
- url: https://west.v2.spadeapi.com
  description: West coast production environment (deprecated)
tags:
- name: Card Enrichment
  description: Enrich card transactions
- name: Transfer Enrichment
  description: Enrich transfers
- name: Category Personalization
  description: Create custom categories and personalize enrichments
- name: Feedback and Reporting
  description: Provide feedback on card events or report enrichment errors
- name: Merchant Search
  description: Search for Spade merchants
- name: Merchant Action Triggers
  description: Register merchant action triggers and receive triggered actions in enrichment responses
- name: Category Action Triggers
  description: Register category action triggers and receive triggered actions in enrichment responses
paths:
  /transactions/cards/enrich:
    post:
      description: 'When working with this endpoint, note that several of the input fields are optional
        (region, acquirerId, etc.). However, we *strongly* recommend including all of the fields that
        you have available. Some optional fields can substantially improve performance.


        Take care to ensure you are using unaltered and correct data in each field. Some fields go by
        multiple names, so if you have any questions regarding integration please feel free to reach out.


        Note that some response fields may not be included in your product package, please reach out with
        any questions.'
      tags:
      - Card Enrichment
      summary: Enrich a card transaction
      operationId: cardEnrich
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CardEnrichmentRequest'
              - type: object
                required:
                - merchantName
                properties:
                  location:
                    type: object
                    required:
                    - city
                    - country
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEnrichmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /transactions/cards/enrich/parse:
    post:
      description: 'Enrich a card transaction where parsed de43 data takes precedence over the other fields
        in the request body.

        This otherwise endpoint is identical to `/transactions/cards/enrich` except that `city` and `merchantName`
        are now

        optional, but only when `de43` is included. Note: Because DE43 format is not consistent between
        sources, we recommend parsing

        your own data and using `/transactions/cards/enrich/` if possible.


        Note that some response fields may not be included in your product package, please reach out to
        sales@spade.com with any questions.

        '
      tags:
      - Card Enrichment
      summary: Enrich a card transaction with an unparsed de43
      operationId: cardEnrichParse
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/CardEnrichmentRequest'
              - type: object
                properties:
                  de43:
                    type: string
                    maxLength: 100
                    description: A well formatted de43 message. If parsable the parsed data (merchantName,
                      city, state) will take precedence over the corresponding fields in the request body.
                      The parser expects an unedited de43, please do not remove special characters or
                      spaces. Our parser currently only supports US transactions.
                    examples:
                    - WALMART.COM            BENTONVILLE  ARUS
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEnrichmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /transactions/transfers/enrich:
    post:
      description: 'Enrich a transfer transaction such as an ACH withdrawal, ACH deposit, or wire transfer.


        When using this endpoint, take care to ensure you are using unaltered and correct data in each
        field.


        Note that transfers enrichment is currently private, please reach out to sales@spade.com to request
        access.'
      tags:
      - Transfer Enrichment
      summary: Enrich a transfer transaction
      operationId: transferEnrich
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferEnrichmentRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferEnrichmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /transactions/universal/enrich:
    post:
      description: 'Enrich any type of transaction such as an aggregator transaction, card transaction,
        ACH withdrawal, ACH deposit, or wire transfer.


        Note that universal enrichment is currently in *beta*, please reach out to sales@spade.com to
        request access.'
      tags:
      - Universal Enrichment
      summary: Enrich a universal transaction
      operationId: universalEnrich
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniversalEnrichmentRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversalEnrichmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /transactions/report:
    post:
      description: 'Endpoint to report a card enrichment as incorrect. An `enrichmentId` and an `errorDescription`
        are required fields to report an enrichment. Optional request fields such as `incorrectLocation`,
        `incorrectLocationDescription`, `incorrectCategory`, `incorrectCategoryDescription`, `incorrectChannel`,
        `incorrectChannelDescription`, `incorrectCounterparty`,  and `incorrectCounterpartyDescription`,
        can be set to indicate what needs to be addressed in  the enrichment. Once a report has been addressed,
        you will receive a corrected enrichment via a callback url you set with Spade. See the callback
        section to learn more on how we send back a corrected enrichment.

        '
      tags:
      - Feedback and Reporting
      summary: Report a card enrichment as incorrect
      operationId: cardReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportApiRequest'
        required: true
      responses:
        '200':
          description: Enrichment reported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      callbacks:
        CorrectedEnrichment:
          https://example.com/your/callback/endpoint:
            post:
              description: 'In order to receive a corrected enrichment, you need to set a callback url
                with Spade. This url must be in HTTPS protocol and return a 2XX response upon success.
                To verify a payload is from Spade, you can verify that the token from `X-Webhook-Token`
                (in the request header) matches the token you receive from Spade.

                '
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CardEnrichmentResponse'
              responses:
                '200':
                  description: Your server returns this code if it accepts the callback
                '400':
                  $ref: '#/components/responses/BadRequest'
                '403':
                  $ref: '#/components/responses/Unauthorized'
                '500':
                  $ref: '#/components/responses/InternalServerError'
  /merchants:
    get:
      x-excluded: true
      description: 'Search for merchants in Spade''s merchant database.


        These merchants show up as counterparties and/or third parties in enrichment responses. Whether
        a merchant shows up as a counterparty or a third party within a given enrichment is based on the
        role it is playing in the transaction.


        Note that merchant `ids` are relatively stable; however, they may change over time due to real-world
        changes (e.g. mergers and acquisitions) as well as general improvements to our merchant database
        which can cause a small percentage of these `ids` to shift over time.


        This endpoint currently supports only a subset of Spade''s merchants (mostly larger, frequently
        transacted merchants), with more merchants being added over time.


        To learn more about merchant search, please read the [Merchant Search Guide](https://docs.spade.com/reference/merchant-search-guide).'
      tags:
      - Merchant Search
      summary: Get detailed merchant information (beta)
      operationId: merchantSearch
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: The name of the merchant you want to find
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /corporations:
    get:
      description: '<Info>This endpoint is in beta. To request access, contact [sales@spade.com](mailto:sales@spade.com).</Info>


        Search for merchants in Spade''s merchant database by name.


        Designed for powering autocomplete experiences, this endpoint returns up to five matching merchants
        with their name, logo, and website.


        To learn more, read the [Merchant Search Guide](https://docs.spade.com/reference/merchant-search-guide).'
      tags:
      - Merchant Search
      summary: Search for merchants
      operationId: corporationSearch
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: The name of the merchant you want to find
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorporationSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /merchant-action-triggers:
    get:
      description: 'Get the status and version of the latest merchant action trigger registration at the
        account scope.


        Account-level triggers apply to all transactions for all users in your account.


        **Important:** Triggers are only applied to enrichment responses when the status is `succeeded`.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Get account-level trigger status
      operationId: merchantActionTriggersGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No action triggers exist for this scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    examples:
                    - No action triggers exist for this scope
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      description: 'Register merchant action triggers at the account scope.


        Account-level triggers apply to all transactions for all users in your account.


        **Field requirements:**

        - `id`, `merchantName`, and `action` are always required for each trigger

        - If location fields (address, city) are NOT provided, `website` is required


        **Batch processing:** Registrations with more than 100 triggers are processed asynchronously as
        a batch job. Poll the GET endpoint to monitor completion.


        **Limits:** Up to 100,000 triggers per request, with a total cap of 300,000 active triggers per
        scope. To register more than 100,000 triggers, split them into ≤100,000 batches sent sequentially
        via PATCH `add` — see [Registering large trigger sets](/reference/realtime-action-triggers-guide#registering-large-trigger-sets).


        **Important:** Triggers are only applied to enrichment responses when the status is `succeeded`.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Register merchant triggers at account scope
      operationId: merchantActionTriggersPut
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantActionTriggerRegistrationRequest'
        required: true
      responses:
        '201':
          description: Registration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A registration is already in progress for this scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    examples:
                    - An action trigger registration is already in progress for this scope.
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      description: 'Perform incremental operations on merchant action triggers at the account scope.


        Supports two operations:

        - **add**: Register new merchants or update existing ones. Only the submitted merchants are affected—existing
        registrations are preserved. If a trigger ID already exists, its registration is replaced (upsert).
        Registrations with more than 100 triggers are processed asynchronously as a batch job.

        - **remove**: Remove merchants by trigger ID. Removed merchants are excluded from enrichment lookups.
        Trigger IDs that are not currently active are silently ignored (idempotent).


        **Limits:** Up to 100,000 triggers per `add` request, with a total cap of 300,000 active triggers
        per scope. To register more than 100,000 triggers, split them into ≤100,000 batches and submit
        them with sequential `add` operations, waiting for each to reach `succeeded` before the next —
        see [Registering large trigger sets](/reference/merchant-action-triggers-guide#registering-large-trigger-sets).


        Successful `add` operations return `201`; successful `remove` operations return `200`.


        **Important:** Only one operation can be in progress per scope at a time. Concurrent requests
        return 409.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Incremental trigger operations at account scope
      operationId: merchantActionTriggersPatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantActionTriggerPatchRequest'
            examples:
              add:
                summary: Add merchant triggers
                value:
                  operation: add
                  merchantTriggers:
                  - id: trigger-1
                    merchantName: Starbucks
                    website: https://www.starbucks.com
                    level: corporation
                    action:
                      type: REWARD
                      rewardPercent: 5
                      offerId: summer-2024-promo
              remove:
                summary: Remove merchant triggers
                value:
                  operation: remove
                  triggerIds:
                  - trigger-1
                  - trigger-2
        required: true
      responses:
        '200':
          description: Remove operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerPatchResponse'
        '201':
          description: Add operation completed (or submitted for batch processing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A registration is already in progress for this scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    examples:
                    - An action trigger registration is already in progress for this scope.
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 'Clear all merchant action triggers at the account scope.


        This creates a new version with an empty trigger list.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Clear account-level triggers
      operationId: merchantActionTriggersDelete
      responses:
        '204':
          description: Triggers cleared successfully
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /programs/{programId}/merchant-action-triggers:
    parameters:
    - in: path
      name: programId
      schema:
        type: string
        maxLength: 512
      description: Your unique identifier for the program
      required: true
    get:
      description: 'Get the status and version of the latest merchant action trigger registration at the
        program scope.


        Program-level triggers apply to all enrichment requests where the `programId` field matches this
        program. See [What is a program?](/reference/merchant-action-triggers-guide#what-is-a-program)
        for more details.


        **Important:** Triggers are only applied to enrichment responses when the status is `succeeded`.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Get program-level trigger status
      operationId: programMerchantActionTriggersGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No action triggers exist for this scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    examples:
                    - No action triggers exist for this scope
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      description: 'Register merchant action triggers at the program scope.


        Program-level triggers apply to all enrichment requests where the `programId` field matches this
        program.


        **Field requirements:**

        - `id`, `merchantName`, and `action` are always required for each trigger

        - If location fields (address, city) are NOT provided, `website` is required


        **Batch processing:** Registrations with more than 100 triggers are processed asynchronously as
        a batch job. Poll the GET endpoint to monitor completion.


        **Limits:** Up to 100,000 triggers per request, with a total cap of 300,000 active triggers per
        scope. To register more than 100,000 triggers, split them into ≤100,000 batches sent sequentially
        via PATCH `add` — see [Registering large trigger sets](/reference/realtime-action-triggers-guide#registering-large-trigger-sets).


        **Important:** Triggers are only applied to enrichment responses when the status is `succeeded`.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Register merchant triggers at program scope
      operationId: programMerchantActionTriggersPut
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantActionTriggerRegistrationRequest'
        required: true
      responses:
        '201':
          description: Registration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A registration is already in progress for this scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    examples:
                    - An action trigger registration is already in progress for this scope.
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      description: 'Perform incremental operations on merchant action triggers at the program scope.


        See the account-scope PATCH endpoint for full documentation on supported operations (add, remove).


        **Limits:** Up to 100,000 triggers per `add` request, with a total cap of 300,000 active triggers
        per scope. To register more than 100,000 triggers, split them into ≤100,000 batches and submit
        them with sequential `add` operations, waiting for each to reach `succeeded` before the next —
        see [Registering large trigger sets](/reference/realtime-action-triggers-guide#registering-large-trigger-sets).'
      tags:
      - Merchant Action Triggers
      summary: Incremental trigger operations at program scope
      operationId: programMerchantActionTriggersPatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantActionTriggerPatchRequest'
        required: true
      responses:
        '200':
          description: Remove operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerPatchResponse'
        '201':
          description: Add operation completed (or submitted for batch processing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A registration is already in progress for this scope
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 'Clear all merchant action triggers at the program scope.


        This creates a new version with an empty trigger list.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Clear program-level triggers
      operationId: programMerchantActionTriggersDelete
      responses:
        '204':
          description: Triggers cleared successfully
        '403':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userId}/merchant-action-triggers:
    parameters:
    - in: path
      name: userId
      schema:
        type: string
        maxLength: 512
      description: Your unique identifier for the user
      required: true
    get:
      description: 'Get the status and version of the latest merchant action trigger registration at the
        user scope.


        User-level triggers apply to all transactions for all cards belonging to the specified user.


        **Important:** Triggers are only applied to enrichment responses when the status is `succeeded`.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Get user-level trigger status
      operationId: userMerchantActionTriggersGet
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No action triggers exist for this scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    examples:
                    - No action triggers exist for this scope
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      description: 'Register merchant action triggers at the user scope.


        User-level triggers apply to all transactions for all cards belonging to the specified user.


        **Field requirements:**

        - `id`, `merchantName`, and `action` are always required for each trigger

        - If location fields (address, city) are NOT provided, `website` is required


        **Limit:** A maximum of 100 `merchantTriggers` can be submitted per request at the user scope.
        Requests exceeding this limit will receive a `400` error.


        **Important:** Triggers are only applied to enrichment responses when the status is `succeeded`.


        To learn more about action triggers, please read the [Merchant Action Triggers Guide](https://docs.spade.com/reference/merchant-action-triggers-guide).'
      tags:
      - Merchant Action Triggers
      summary: Register merchant triggers at user scope
      operationId: userMerchantActionTriggersPut
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantActionTriggerRegistrationRequest'
        required: true
      responses:
        '201':
          description: Registration created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A registration is already in progress for this scope
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    examples:
                    - An action trigger registration is already in progress for this scope.
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      description: 'Perform incremental operations on merchant action triggers at the user scope.


        See the account-scope PATCH endpoint for full documentation on supported operations (add, remove).'
      tags:
      - Merchant Action Triggers
      summary: Incremental trigger operations at user scope
      operationId: userMerchantActionTriggersPatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantActionTriggerPatchRequest'
        required: true
      responses:
        '200':
          description: Remove operation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionTriggerPatchResponse'
        '201':
          description: Add operation completed (or submitted for batch processing)
