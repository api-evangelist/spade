    CardEnrichmentRequest:
      type: object
      required:
      - userId
      - amount
      - currencyCode
      - occurredAt
      - categoryCode
      - location
      properties:
        merchantName:
          type: string
          maxLength: 1024
          description: The raw, unmodified merchant name (including asterisks, store numbers, etc...)
          examples:
          - Amazon
        organizationId:
          type: string
          maxLength: 256
          description: An ID representing the organization associated with this transaction. Use this
            field if you are enriching transactions on behalf of other organizations. Used for billing
            purposes and for scoping products such as action triggers and category personalizations at
            the organization-level. For more info, see [Supporting multiple data sources and clients](https://docs.spade.com/reference/integrate-with-spades-api#supporting-multiple-data-sources-and-clients)
          examples:
          - organization_id_123
        programId:
          type: string
          maxLength: 512
          description: An identifier for the program associated with this transaction. Programs can be
            used to group transactions and scope action triggers at the program level.
          examples:
          - program_id_123
        userId:
          type: string
          maxLength: 512
          description: Anonymous ID representing your user. This will be used for summary features, and
            recurrence flagging purposes.
          examples:
          - user_id_123456789
        cardId:
          type: string
          maxLength: 512
          description: Anonymous ID representing the card of the user.
          examples:
          - card_id_123456789
        cardFirstSix:
          type: string
          minLength: 6
          maxLength: 6
          description: The first six digits of the card number associated with the transaction.
          examples:
          - '123456'
        cardLastFour:
          type: string
          minLength: 4
          maxLength: 4
          description: The last four digits of the card number associated with the transaction.
          examples:
          - '7890'
        transactionId:
          type: string
          maxLength: 512
          description: Your ID representing this transaction
          examples:
          - transaction_id_123456789
        acquirerId:
          type: string
          maxLength: 256
          description: An alphanumeric code generally with a maximum length of 15. It is also known as
            "Network ID", "Card Acceptor ID", or "Merchant ID". (Found in field 42 of ISO 8583)
          examples:
          - '000000000123456'
        amount:
          type:
          - number
          - string
          maxLength: 15
          description: Value of the transaction in the given currency. Negative values indicate incoming
            money.
          examples:
          - '25.23'
        currencyCode:
          type: string
          maxLength: 16
          examples:
          - USD
        occurredAt:
          type: string
          format: date-time
          description: The time the transaction occurred. Formatted as an ISO 8601 date time.
          examples:
          - '2022-06-15 18:27:51Z'
        categoryCode:
          type: string
          maxLength: 32
          description: Category code for the given categoryType
          examples:
          - '5812'
        categoryType:
          type: string
          maxLength: 32
          minLength: 1
          nullable: false
          enum:
          - MCC
          default: MCC
          examples:
          - MCC
          description: The category system that categoryCode is a part of. Optional; if omitted it defaults
            to `MCC`. Do not send `null` or an empty string — when the field is present it must be a valid,
            non-empty value (`MCC`).
        location:
          $ref: '#/components/schemas/CommonRequestLocation'
        billingProfile:
          type: string
          enum:
          - standard
          - resell
          description: An optional billing profile for this transaction. When set to "resell", the `organizationId`
            field is required. For more information, see [Supporting multiple data sources and clients](https://docs.spade.com/reference/integrate-with-spades-api#supporting-multiple-data-sources-and-clients)
          examples:
          - standard
        customAttributes:
          $ref: '#/components/schemas/CustomAttributesRequestField'
    TransferEnrichmentRequest:
      type: object
      required:
      - userId
      - amount
      - currencyCode
      - occurredAt
      - transactionType
      - description
      properties:
        organizationId:
          type: string
          maxLength: 256
          description: An ID representing the organization associated with this transaction. Use this
            field if you are enriching transactions on behalf of other organizations. Used for billing
            purposes and for scoping products such as action triggers and category personalizations at
            the organization-level. For more information, see [Supporting multiple data sources and clients](https://docs.spade.com/reference/integrate-with-spades-api#supporting-multiple-data-sources-and-clients)
          examples:
          - organization_id_123
        userId:
          type: string
          maxLength: 512
          description: Anonymous ID representing your user. This will be used for summary features, recurrence
            flagging, and category personalization purposes.
          examples:
          - user_id_123456789
        accountId:
          type: string
          maxLength: 512
          description: Anonymous ID representing the account of the user (NOT the account number).
          examples:
          - account_id_123456789
        transactionId:
          type: string
          maxLength: 512
          description: Your ID representing this transaction
          examples:
          - transaction_id_123456789
        transactionType:
          type: string
          maxLength: 32
          description: The type of this transaction. By default, the accepted types include `ACH_DEPOSIT`,
            `ACH_RETURN`, `ACH_WITHDRAWAL`, `ATM`, `CHECK_DEPOSIT`, `CHECK_PAYMENT`, `INTERNATIONAL_WIRE_INCOMING`,
            `INTERNATIONAL_WIRE_OUTGOING`, `RTP_DEPOSIT`, `RTP_WITHDRAWAL`, `US_WIRE_INCOMING`, `US_WIRE_OUTGOING`,
            `OTHER_INCOMING`, and `OTHER_OUTGOING`; however, this endpoint also supports a variety of
            other transfer types, depending on your use case and the data you have available. Please contact
            your Spade representative if you would like further information about supported transaction
            types.
          examples:
          - ACH_DEPOSIT
          - ACH_RETURN
          - ACH_WITHDRAWAL
          - ATM
          - CHECK_DEPOSIT
          - CHECK_PAYMENT
          - INTERNATIONAL_WIRE_INCOMING
          - INTERNATIONAL_WIRE_OUTGOING
          - RTP_DEPOSIT
          - RTP_WITHDRAWAL
          - US_WIRE_INCOMING
          - US_WIRE_OUTGOING
          - OTHER_INCOMING
          - OTHER_OUTGOING
        transactionTypeDescription:
          type: string
          maxLength: 64
          description: A description of the `transactionType`. This field is intended for systems in which
            the `transactionType` is a numeric code. In these cases, `transactionTypeDescription` should
            be the human-readable description of the `transactionType`.
          examples:
          - ACH Withdrawal
          - ACH Deposit
        description:
          type: string
          maxLength: 1024
          description: The full transaction description. Typically, this will be a string containing the
            name of the merchant or institution involved in the transaction plus information related to
            the type of transaction such as "ACCT VERIFY", "WEB PMT", "ETRANSFER", etc...
          examples:
          - AMAZON CORP SYF PAYMNT
        alternateDescription:
          type: string
          maxLength: 1024
          description: An alternate transaction description, if available. This will often be a string
            containing the name of the merchant or institution involved in the transaction. Note that
            this field is optional and may or may not be available in your system. Please contact your
            Spade representative if you have any questions about field mappings.
          examples:
          - AMAZON CORP
        memo:
          type: string
          maxLength: 1024
          description: The transaction memo, if your system contains an additional field beyond the `description`
            and `alternateDescription` fields. Note that this field is optional and may or may not be
            available in your system. Please contact your Spade representative if you have any questions
            about field mappings.
          examples:
          - 100 PUBLIC SQUARE CLEVELAND OH
        amount:
          type:
          - number
          - string
          maxLength: 15
          description: Value of the transaction in the given currency. Negative values indicate incoming
            money.
          examples:
          - '283.78'
        currencyCode:
          type: string
          maxLength: 16
          examples:
          - USD
        occurredAt:
          type: string
          format: date-time
          description: The time the transaction occurred. Formatted as an ISO 8601 date time.
          examples:
          - '2022-06-15 18:27:51Z'
        direction:
          type: string
          maxLength: 8
          description: The direction of the transaction. Will take precedence over the direction inferred
            from the `amount` field.
          enum:
          - CREDIT
          - DEBIT
          examples:
          - CREDIT
          - DEBIT
        billingProfile:
          type: string
          enum:
          - standard
          - resell
          description: An optional billing profile for this transaction. When set to "resell", the `organizationId`
            field is required. For more information, see [Supporting multiple data sources and clients](https://docs.spade.com/reference/integrate-with-spades-api#supporting-multiple-data-sources-and-clients)
          examples:
          - standard
        customAttributes:
          $ref: '#/components/schemas/CustomAttributesRequestField'
