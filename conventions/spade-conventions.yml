authentication:
  style: api-key
  location: header
  header: X-Api-Key
  rationale: Secret-key header auth chosen as the fastest approach for low-latency applications.
  environments_have_separate_keys: true
regions:
  strategy: Call the geographically nearest server (east/west) to minimize enrichment latency.
batch_processing:
  async_pattern: >-
    Batch enrichment returns a `batchId`; poll `/batches/{batchId}` for status and
    `/batches/{batchId}/results` for results, or supply a `callbackUrl` for completion notification.
  synchronous_option: >-
    Pass `?synchronous=true` on batch endpoints for inline results on small datasets. The per-request
    cap is `synchronousMax`, discoverable at runtime via the endpoint metadata (OPTIONS) operations.
idempotency:
  key_header: false
  note: >-
    Spade does not document an Idempotency-Key header for retry-safe writes. Trigger and registration
    operations are described as naturally idempotent (PUT registrations replace state; trigger IDs that
    are not active are silently ignored). A 409 is returned when a registration is already in progress
    for a scope.
