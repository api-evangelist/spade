note: >-
  Two real documents are served, both from the docs host (docs.spade.com). The API hosts
  (east/west .api. and .sandbox. spade.com) answer 403 Forbidden to every anonymous request
  including /.well-known/* — the edge rejects unauthenticated traffic before routing, so absence
  there is unproven rather than measured. www.spade.com returns its Next.js 404 page for every
  /.well-known/ path. No security.txt is published anywhere, so no SecurityTxt pointer is emitted.
