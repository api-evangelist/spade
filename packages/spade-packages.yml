note: >-
  Spade ships NO first-party client libraries in any language. This is a deliberate posture
  consistent with the product: sub-50ms enrichment called from an authorization path, documented as
  direct HTTP with an `X-Api-Key` header, with explicit guidance on connection reuse, parallel
  connections and HTTP/1.1 limits — advice that assumes the caller owns the transport. The
  substitute Spade does publish is a forkable public Postman collection
  (https://app.getpostman.com/run-collection/45578594-3ac97973-91ba-4d95-ad07-c058a347bddc), wired
  into apis.yml as type Postman, plus the OpenAPI itself.
  No `SDKs` or `Packages` pointer is emitted in apis.yml: this file records a measured absence, and
  a pointer would assert a surface the provider does not serve.
gaps_for_provider:
  - >-
    No official SDK in any language. A thin typed client for JavaScript/TypeScript and Python would
    close the largest remaining experience gap, especially for the batch/microbatch polling flow and
    the 300k-trigger sequential PATCH pattern, both of which currently require hand-written
    orchestration.
