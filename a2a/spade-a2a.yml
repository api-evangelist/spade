deviations:
  - field: name
    observed: Introduction
    issue: >-
      The card's `name` is the title of the docs landing page, not the organization or agent name.
      "Introduction" is the Mintlify default derived from the first docs page, so the card does not
      identify itself as Spade at the top level.
    severity: cosmetic
  - field: provider.organization
    observed: Introduction
    issue: >-
      Same platform default. A2A expects the publishing organization here; "Spade" would be correct.
    severity: cosmetic
  - field: url
    observed: https://docs.spade.com/
    issue: >-
      Points at the documentation site root rather than an A2A JSON-RPC / HTTP+JSON agent endpoint.
      An A2A client resolving this card reaches an HTML docs site, not a callable agent. The card is
      a discovery + skill-advertisement document, not a live agent transport.
    severity: functional
  - field: skills[].tags
    observed: []
    issue: Skill carries no tags, so it cannot be matched by capability taxonomy.
    severity: cosmetic
note: >-
  Real 200, real JSON object, real AgentCard shape — this is a published card, not an SPA catch-all
  (the same host 404s /.well-known/agent.json, /.well-known/security.txt and /.well-known/ai-plugin.json,
  so it is not answering 200 to everything). It is generated by the Mintlify documentation platform
  rather than hand-authored by Spade, which is why the identity fields carry platform defaults. The
  substantive content — the single `spade` skill and its linked skill.md — IS Spade-specific and
  accurate, and is saved verbatim to skills/spade-skill.md.
